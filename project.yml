name: DouDizhu
options:
  bundleIdPrefix: top.ap7
  # ⚠️ 必须与 CI 选的 Xcode 匹配：XcodeGen 默认按最新（Xcode 16+）生成
  # 格式 77 的工程，Xcode 15.x 打开会直接报 "future Xcode project file format (77)"。
  projectFormat: xcode15_3
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  DouDizhu:
    type: application
    platform: iOS
    sources:
      - path: DouDizhu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.ap7.doudizhu
        PRODUCT_NAME: DouDizhu
        INFOPLIST_FILE: DouDizhu/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
