name: build-ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 优先用 15.4（与 project.yml 的 projectFormat 匹配）；
          # 没有就退回 runner 默认版本，工程格式仍能兼容。
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -oE '[0-9]+\.[0-9]+' VERSION | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project DouDizhu.xcodeproj \
                     -scheme DouDizhu \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     ENABLE_BITCODE=NO \
                     | tee build.log
          # 把错误行提到前面，避免日志几千行看不到根因
          echo "----- 编译错误摘要 -----"
          grep -E "error:" build.log | sort -u | head -40 || true

      - name: Package ipa
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没有找到 .app 产物"
            exit 1
          fi
          echo "App bundle: $APP"
          cp -R "$APP" Payload/
          # 去掉内嵌的 frameworks 签名残留
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          # 确认未签名
          if find Payload -name "_CodeSignature" | grep -q .; then
            echo "::error::产物仍带签名"
            exit 1
          fi
          VERSION=$(grep -oE '[0-9]+\.[0-9]+' VERSION | head -1)
          zip -qry "DouDizhu${VERSION}.ipa" Payload
          rm -rf Payload
          ls -la DouDizhu*.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: DouDizhu-ipa
          path: DouDizhu*.ipa
          retention-days: 30
